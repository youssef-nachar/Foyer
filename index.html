<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Management System</title>
    <link rel="stylesheet" href="Foyer.css">
</head>
<body>

    <h1>Building Management System</h1>
<div class="dashboard">

   <div class="card" onclick="showKpi('occupied')">
    Occupied: <span id="occupiedBeds">0</span>
   </div>

<div class="card" onclick="showKpi('available')">
    Available: <span id="availableBeds">0</span>
  </div>

<div class="card" onclick="showKpi('paid')">
    Paid: <span id="paidCustomers">0</span>
</div>

<div class="card" onclick="showKpi('unpaid')">
    Unpaid: <span id="unpaidCustomers">0</span>
</div>
<div class="search-box">
    <input id="searchInput" type="text" placeholder="Search by name, bed, room, apartment...">
</div>
<button onclick="showHistory()">Payment History</button>
</div>
    <div id="building"></div>
<!-- Customer Modal -->

<div id="customerModal" class="modal">

    <div class="modal-content">

        <h2>Add Customer</h2>

        <input type="text" id="customerName" placeholder="Customer Name">

        <input type="text" id="customerPhone" placeholder="Phone Number">


        <button id="saveCustomer">Save</button>

        <button id="cancelCustomer">Cancel</button>

    </div>
<div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Edit Customer</h2>

        <input type="text" id="editName" placeholder="Customer Name">
        <input type="text" id="editPhone" placeholder="Phone Number">

        <select id="editPaid">
            <option value="Paid">Paid</option>
            <option value="Not Paid">Not Paid</option>
        </select>

        <button id="updateCustomer">Update</button>
        <button id="checkoutCustomer">Check Out</button>
        <button id="cancelEdit">Cancel</button>

    </div>

</div>
</div>
<div id="kpiModal" class="modal">
    <div class="modal-content">
        <h2 id="kpiTitle">Details</h2>
        <div id="kpiList"></div>
        <button onclick="closeKpi()">Close</button>
    </div>
</div>
<div id="historyModal" class="modal">
    <div class="history-box">

        <div class="history-header">
            <h2>Payment History</h2>
            <button onclick="closeHistory()">✖</button>
        </div>

        <div id="historyContainer"></div>

    </div>
</div>
    <script src="Foyer.js"></script>

</body>
</html>
