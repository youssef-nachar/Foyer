<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Management System</title>

    <link rel="stylesheet" href="Foyer.css">
</head>
<body>
    <header>
        <h1>🏢 Building Management System</h1>
    </header>

    <!-- Dashboard -->
    <section class="dashboard">

        <div class="card" onclick="showKpi('occupied')">
            <h3>Occupied</h3>
            <span id="occupiedBeds">0</span>
        </div>

        <div class="card" onclick="showKpi('available')">
            <h3>Available</h3>
            <span id="availableBeds">0</span>
        </div>

        <div class="card" onclick="showKpi('paid')">
            <h3>Paid</h3>
            <span id="paidCustomers">0</span>
        </div>

        <div class="card" onclick="showKpi('unpaid')">
            <h3>Unpaid</h3>
            <span id="unpaidCustomers">0</span>
        </div>

    </section>

    <!-- Search + Actions -->
    <section class="top-bar">

        <div class="search-box">
            <input
                id="searchInput"
                type="text"
                placeholder="Search by customer, floor, apartment, room or bed...">
        </div>

        <button class="history-btn" onclick="showHistory()">
            📄 Payment History
        </button>

    </section>

    <!-- Building -->
    <main id="building"></main>

    <!-- ========================= -->
    <!-- Add Customer -->
    <!-- ========================= -->

    <div id="customerModal" class="modal">

        <div class="modal-content">

            <h2>Add Customer</h2>

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name">

            <input
                type="text"
                id="customerPhone"
                placeholder="Phone Number">

            <button id="saveCustomer">
                Save
            </button>

            <button id="cancelCustomer">
                Cancel
            </button>

        </div>

    </div>

    <!-- ========================= -->
    <!-- Edit Customer -->
    <!-- ========================= -->

    <div id="editModal" class="modal">

        <div class="modal-content">

            <h2>Edit Customer</h2>

            <input
                type="text"
                id="editName"
                placeholder="Customer Name">

            <input
                type="text"
                id="editPhone"
                placeholder="Phone Number">

            <select id="editPaid">
                <option value="Paid">Paid</option>
                <option value="Not Paid">Not Paid</option>
            </select>

            <button id="updateCustomer">
                Update
            </button>

            <button id="checkoutCustomer">
                Check Out
            </button>

            <button id="cancelEdit">
                Cancel
            </button>

        </div>

    </div>

    <!-- ========================= -->
    <!-- KPI Modal -->
    <!-- ========================= -->

    <div id="kpiModal" class="modal">

        <div class="modal-content">

            <h2 id="kpiTitle">Details</h2>

            <div id="kpiList"></div>

            <button onclick="closeKpi()">
                Close
            </button>

        </div>

    </div>

    <!-- ========================= -->
    <!-- Payment History -->
    <!-- ========================= -->

<!-- =========================
     Payment History
========================= -->

<!-- =========================
     Payment History
========================= -->

<div id="historyModal" class="modal">

    <div class="history-box">

        <div class="history-header">

            <div>
                <h2>💳 Payment History</h2>
                <small>All customer payment records</small>
            </div>

            <button class="close-btn" onclick="closeHistory()">✕</button>

        </div>

        <div class="history-toolbar">

            <input
                type="text"
                id="historySearch"
                placeholder="🔍 Search customer...">

        </div>

        <div class="history-table-container">

            <table class="history-table">

                <tbody id="historyContainer">

                    <!-- JavaScript سيضيف الصفوف هنا -->

                </tbody>

            </table>

        </div>

    </div>

</div>
<div id="confirmModal" class="modal">
    <div class="modal-content confirm-box">

        <h2>⚠️ Confirmation</h2>

        <p id="confirmText">
            Are you sure you want to change this customer to Unpaid?
        </p>

        <div class="confirm-buttons">
            <button id="confirmCancel" class="cancel-btn">
                Cancel
            </button>

            <button id="confirmOk" class="danger-btn">
                Yes, Change
            </button>
        </div>

    </div>
</div>
    <script src="Foyer.js"></script>

</body>
</html>
